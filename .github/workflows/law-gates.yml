name: ALX Law Gates

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  # Only to read the review evidence GitHub already holds for this pull
  # request. The gate reads reviews; it never requests, writes or pays for one.
  pull-requests: read

jobs:
  law-gates:
    name: law-gates
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt

      - name: Verify governance
        run: python scripts/check_governance.py

      - name: Verify architecture boundaries
        run: python scripts/check_architecture.py

      - name: Verify an accepted independent review covers this head
        # Reporting only. D-026 makes this blocking once it has accumulated
        # evidence on real merges and Friedl approves the promotion; until
        # then `Greptile Review` remains the enforcing check.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/check_independent_review.py \
            --repository "${{ github.repository }}" \
            --pull-request "${{ github.event.pull_request.number || 0 }}" \
            --head-sha "${{ github.event.pull_request.head.sha || '' }}"

      - name: Test the enforcement gates
        run: python -m unittest discover -s tests -v
