name: ALX Law Gates

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  # Only to read the review evidence GitHub already holds for this pull
  # request. The gate reads reviews; it never requests, writes or pays for one.
  pull-requests: read

jobs:
  law-gates:
    name: law-gates
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt

      - name: Verify governance
        run: python scripts/check_governance.py

      - name: Verify architecture boundaries
        run: python scripts/check_architecture.py

      - name: Test the enforcement gates
        run: python -m unittest discover -s tests -v

  # A separate job so branch protection can require it by name. Folding it into
  # law-gates would make "no qualifying review" indistinguishable from "a law
  # gate broke", and the two need different responses.
  independent-review:
    name: independent-review
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # The trusted checkout, and the only thing this job runs. It is the base
      # revision GitHub attests, never the proposed merge tree, so a pull
      # request cannot supply the verifier, the reviewer roster or the
      # exception register used to judge it. On a push there is no pull
      # request, so the pushed commit is itself the trusted revision.
      - name: Check out the trusted base revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          path: trusted

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify an accepted independent review covers this head
        # Blocking, promoted from reporting-only by Friedl on 2026-09-06 under
        # D-026 ("Rollout"), which also removed `Greptile Review` as a required
        # check. Recorded here as well as in the decision, so the authorisation
        # for this enforcement is visible where the enforcement is defined.
        #
        # Any reviewer in the *trusted* review/accepted_reviewers.json
        # can satisfy it, which is what makes the requirement a property rather
        # than a provider.
        #
        # Every path here points into `trusted/`: the script executed, and the
        # `--root` it reads its policy from. Pointing either at the workspace
        # would let a change judge itself, which is the defect this job exists
        # to prevent.
        #
        # `--event-name` is passed explicitly so that a pull_request event
        # arriving without its number fails closed instead of passing with
        # nothing verified.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python trusted/scripts/check_independent_review.py \
            --enforce \
            --root trusted \
            --event-name "${{ github.event_name }}" \
            --repository "${{ github.repository }}" \
            --pull-request "${{ github.event.pull_request.number || 0 }}" \
            --head-sha "${{ github.event.pull_request.head.sha || '' }}"
