name: ALX Law Gates

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  # Only to read the review evidence GitHub already holds for this pull
  # request. The gate reads reviews; it never requests, writes or pays for one.
  pull-requests: read

jobs:
  law-gates:
    name: law-gates
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt

      - name: Verify governance
        run: python scripts/check_governance.py

      - name: Verify architecture boundaries
        run: python scripts/check_architecture.py

      - name: Test the enforcement gates
        run: python -m unittest discover -s tests -v

  # A separate job so branch protection can require it by name. Folding it into
  # law-gates would make "no qualifying review" indistinguishable from "a law
  # gate broke", and the two need different responses.
  independent-review:
    name: independent-review
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify an accepted independent review covers this head
        # Blocking. D-026's rollout reserved this promotion to Friedl, who
        # approved it on 2026-09-06; `Greptile Review` is removed as a required
        # check in the same change. Any reviewer in review/accepted_reviewers.json
        # can satisfy it, which is what makes the requirement a property rather
        # than a provider.
        #
        # `--event-name` is passed explicitly so that a pull_request event
        # arriving without its number fails closed instead of passing with
        # nothing verified.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/check_independent_review.py \
            --enforce \
            --event-name "${{ github.event_name }}" \
            --repository "${{ github.repository }}" \
            --pull-request "${{ github.event.pull_request.number || 0 }}" \
            --head-sha "${{ github.event.pull_request.head.sha || '' }}"
