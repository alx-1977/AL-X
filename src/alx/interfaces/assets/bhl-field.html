<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#010710">
<title>AL/X · BHL signal field</title>
<style>
:root{--ice:#e9fbff;--pale:#b1d5e0;--muted:#66889a;--hair:rgba(104,195,226,.24);--blue:#00cfff;--amber:#ffac00;--red:#ff254f;--green:#00ffc6}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}body{color:var(--ice);font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased;user-select:none}
#matrix{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:crosshair;touch-action:none}
body:before{content:"";position:fixed;inset:0;pointer-events:none;z-index:1;background:linear-gradient(90deg,transparent 67%,rgba(1,7,16,.32) 71%,rgba(1,7,16,.58) 75%,rgba(1,7,16,.62)),linear-gradient(180deg,rgba(1,7,16,.5),transparent 25%,transparent 80%,rgba(1,7,16,.17));}
.shell{position:fixed;inset:0;z-index:3;pointer-events:none}
.mast{position:absolute;left:clamp(26px,4.3vw,82px);top:clamp(24px,4.4vh,62px)}
.brand{font-weight:200;font-size:clamp(26px,2.8vw,42px);line-height:1;letter-spacing:-.09em;text-shadow:0 0 28px rgba(103,219,249,.19)}.brand span{color:#63d7f6;padding:0 .09em;font-weight:100}.brand-sub{font:9px/1.9 "Courier New",monospace;letter-spacing:.35em;color:#7ca9b8;margin-top:17px}
.metrics{position:absolute;top:clamp(33px,5.4vh,72px);right:clamp(28px,4.3vw,82px);display:flex;gap:clamp(24px,3vw,60px);align-items:flex-start;text-align:right}
.metric-num{font-weight:200;font-size:clamp(23px,2.65vw,39px);line-height:1;letter-spacing:-.06em}.metric-num small{font-size:.51em;color:#7aa4b4;letter-spacing:0}.metric-label{font:9px/2 "Courier New",monospace;letter-spacing:.17em;color:#668b9a;margin-top:9px}.metric.danger .metric-num{color:var(--amber)}
.field-id{position:absolute;left:clamp(26px,4.3vw,82px);bottom:clamp(26px,6vh,86px);font:10px/1.9 "Courier New",monospace;letter-spacing:.13em;color:#7196aa}.field-id b{font-weight:400;color:#b9e9f5}.field-id .live{width:5px;height:5px;display:inline-block;border-radius:50%;background:var(--blue);box-shadow:0 0 8px 2px rgba(52,205,255,.44);margin-right:11px;vertical-align:2px}
.demo-label{position:absolute;right:clamp(28px,4.3vw,82px);bottom:clamp(25px,5vh,78px);font:9px/1.6 "Courier New",monospace;letter-spacing:.12em;color:rgba(113,153,165,.50);text-align:right}
.side{position:absolute;right:clamp(29px,4.6vw,94px);top:27%;width:clamp(268px,23vw,390px);min-height:410px;opacity:0;transform:translateX(13px);transition:opacity .5s ease,transform .5s ease;pointer-events:auto}.side.visible{opacity:1;transform:translateX(0)}
.case-body{opacity:0;visibility:hidden;transform:translateY(12px);transition:opacity .26s ease,transform .4s ease,visibility 0s .4s;pointer-events:none}
.side.readout-visible .case-body{opacity:1;visibility:visible;transform:translateY(0);pointer-events:auto;transition:opacity .55s ease,transform .55s cubic-bezier(.16,1,.3,1),visibility 0s}
.side.readout-visible .case-body>*{animation:terminalEntry .54s both cubic-bezier(.2,1,.32,1);animation-delay:var(--delay,0ms)}
@keyframes terminalEntry{from{opacity:0;transform:translateY(8px);filter:blur(3px)}to{opacity:1;transform:translateY(0);filter:blur(0)}}
.focus-led{position:relative;z-index:1}
.side.acquiring .focus-led{box-shadow:0 0 7px 2px rgba(116,238,255,.67),0 0 29px 4px rgba(92,215,255,.29)}
.side-head{display:flex;gap:12px;align-items:center;font:10px/1.5 "Courier New",monospace;letter-spacing:.18em;color:#80b4c4}.focus-led{display:inline-block;flex:none;width:5px;height:5px;border-radius:50%;background:#9deeff;box-shadow:0 0 9px 2px rgba(72,212,255,.65)}
.side-meta{font:10px/1.6 "Courier New",monospace;letter-spacing:.18em;color:#6d99ac;margin-top:43px}.side-name{font-weight:200;font-size:clamp(31px,3vw,48px);line-height:1.05;letter-spacing:-.058em;margin:12px 0 10px;text-shadow:0 0 40px rgba(90,230,255,.12)}
.side-issue{font:11px/1.8 "Courier New",monospace;letter-spacing:.07em;color:var(--amber)}.side-issue.critical{color:var(--red)}.side-issue.recovering{color:var(--green)}.side-issue.healthy{color:var(--green)}
.side-context{font:10px/2.0 "Courier New",monospace;color:#98bcca;margin-top:23px;letter-spacing:.015em}.side-context span{color:#618aa0}
.progress-rule{position:relative;width:100%;height:1px;background:linear-gradient(90deg,rgba(74,191,221,.55),rgba(74,191,221,.15),transparent);margin:24px 0 20px}.progress-rule:before{content:"";position:absolute;top:-1px;left:0;width:var(--progress,10%);height:2px;background:var(--tone,var(--blue));box-shadow:0 0 12px 2px var(--tone,var(--blue));transition:width .8s ease}
.action-header{font:9px/1.6 "Courier New",monospace;letter-spacing:.16em;color:#7cabbd}.action-text{min-height:50px;margin-top:10px;font:14px/1.55 "Courier New",monospace;font-weight:400;color:#d4edf1;max-width:33ch}.cursor{display:inline-block;width:7px;height:13px;vertical-align:-2px;margin-left:5px;background:#d4edf1;animation:cursor 1.1s steps(1,end) infinite}@keyframes cursor{50%{opacity:0}}
.sr-only{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.log{margin-top:22px;font:10px/1.88 "Courier New",monospace;color:rgba(141,179,191,.66);letter-spacing:.012em;min-height:86px}.log-row{display:flex;gap:14px}.log-row time{color:#517c8f;flex:none}.log-row span{flex:1}
.manual{margin-top:18px;font:9px/1.5 "Courier New",monospace;letter-spacing:.09em;color:rgba(113,170,186,.54)}
.keyline{position:absolute;left:clamp(26px,4.3vw,82px);bottom:21%;display:flex;gap:15px;align-items:center;font:9px/1.7 "Courier New",monospace;letter-spacing:.10em;color:rgba(111,174,193,.54)}.keyline:before{content:"";display:block;width:34px;height:1px;background:rgba(75,177,199,.44)}
@media (max-width:1050px){.side{right:36px;top:31%;width:275px}.side-name{font-size:35px}.field-id{bottom:32px}.keyline{bottom:17%}.metrics{gap:24px}}
@media (max-width:740px){body:before{background:linear-gradient(180deg,rgba(1,7,16,.26) 0%,transparent 24%,rgba(1,7,16,.45) 38%,rgba(1,7,16,.82) 60%,rgba(1,7,16,.83) 77%,rgba(1,7,16,.36) 94%)}.mast{top:23px;left:24px}.brand{font-size:30px}.brand-sub{font-size:7px;margin-top:11px;letter-spacing:.10em;max-width:172px}.metrics{top:26px;right:21px;gap:14px}.metric-num{font-size:23px}.metric-label{font-size:7px;letter-spacing:.04em}.side{left:24px;right:24px;top:auto;bottom:16%;width:auto;min-height:0;max-width:370px}.side-meta{margin-top:17px}.side-name{font-size:32px}.side-context{margin-top:12px;font-size:9px}.progress-rule{margin:13px 0}.action-text{font-size:12px;min-height:0}.log{font-size:9px;line-height:1.5;margin-top:10px;min-height:0}.log-row:nth-child(-n+2){display:none}.keyline,.manual,.demo-label{display:none}.field-id{bottom:14px;left:24px;font-size:8px}}

/* ---- pass 1: readable readout, labels on the field ---- */
.side-head{font-size:12px;color:#a9d8e6}
.side-meta{font-size:11px;color:#8fb8c8;margin-top:34px}
.side-name .way{margin-left:.35em;font-size:.42em;letter-spacing:.18em;color:#8fc4d4;vertical-align:.55em}
.side-name{font-size:clamp(36px,3.4vw,54px);letter-spacing:-.04em;text-shadow:0 0 30px rgba(90,230,255,.25)}
.side-issue{font-size:14px;letter-spacing:.05em;text-shadow:0 0 14px currentColor}
.side-context{font-size:13px;line-height:1.9;color:#c4e2ea}.side-context span{color:#7fa8b8}
.action-header{font-size:11px;color:#9fd2e2;letter-spacing:.2em}
.action-text{font-size:17px;line-height:1.5;color:#effcff;max-width:30ch}
.cursor{height:16px;width:8px;background:#effcff}
.log{font-size:13px;color:rgba(178,214,224,.8)}.log-row time{color:#6f9db0}
.metric-num{font-size:clamp(28px,3vw,46px)}.metric-label{font-size:10px;color:#89b2c2}
.metric.danger .metric-num{color:#ffb21a;text-shadow:0 0 22px rgba(255,170,0,.45)}
.field-id{font-size:12px;color:#8fb6c6}.demo-label{font-size:10px}
.tags{position:fixed;inset:0;z-index:2;pointer-events:none}
.tag{position:absolute;transform:translate(26px,calc(-100% - 30px - var(--lift,0px)));white-space:nowrap;padding:3px 0 3px 10px;border-left:1px solid currentColor;font:600 12px/1.3 "Courier New",monospace;letter-spacing:.12em;text-transform:uppercase;text-shadow:0 0 3px #000,0 0 8px #000,0 0 14px rgba(0,0,0,.9);transition:opacity .4s}
.tag::before{content:"";position:absolute;left:-27px;bottom:calc(-30px - var(--lift,0px));height:calc(30px + var(--lift,0px)) !important;/* reader (bottom left) to the foot of the label's line (top right) */width:27px;height:30px;background:linear-gradient(to bottom right,transparent calc(50% - .6px),currentColor 50%,transparent calc(50% + .6px));opacity:.75}
.tag small{display:block;font-weight:400;font-size:11px;letter-spacing:.06em;color:#e8f6fa;text-transform:none}
.tag.red{color:#ff5a78}.tag.amber{color:#ffc24a}.tag.focus{opacity:0}
.tag.left{transform:translate(calc(-100% - 26px),calc(-100% - 30px - var(--lift,0px)));padding:3px 10px 3px 0;border-left:0;border-right:1px solid currentColor;text-align:right}
.tag.left::before{left:auto;right:-27px;background:linear-gradient(to bottom left,transparent calc(50% - .6px),currentColor 50%,transparent calc(50% + .6px))}.tag.hidden{display:none}

/* the live line is the newest row of the log */
.log{min-height:0;margin-top:14px}
.action-text{display:flex;gap:14px;min-height:0;max-width:none;margin-top:0;font:13px/1.88 "Courier New",monospace;color:#effcff;text-shadow:0 0 10px rgba(120,230,255,.35)}
.action-text time{flex:none;color:#9fd2e2}
.action-words{flex:1}
.cursor{height:13px;width:7px;vertical-align:-2px}

/* ---- the lock-on: crisp HUD geometry instead of the vein ---- */
.lock{position:fixed;inset:0;width:100%;height:100%;z-index:2;pointer-events:none;overflow:visible}
.lock *{vector-effect:non-scaling-stroke}
.lock .wire{fill:none;stroke:#7fe9ff;stroke-width:1.5;filter:drop-shadow(0 0 3px rgba(80,220,255,.9))}
.lock .flow{fill:none;stroke:#eaffff;stroke-width:1.6;stroke-dasharray:3 26;filter:drop-shadow(0 0 4px #7fe9ff)}
.lock .node{fill:#eaffff;filter:drop-shadow(0 0 4px #7fe9ff)}
.lock .target{color:#3fe2ff}
.lock .target g{fill:none;stroke:currentColor;filter:drop-shadow(0 0 1px #000) drop-shadow(0 0 5px rgba(63,226,255,.85))}
.lock .t-outer{stroke-width:7}
.lock .t-thin{stroke-width:2;opacity:.85}
.lock .t-dots circle{stroke-width:2.4;stroke-dasharray:.1 6;stroke-linecap:round}
.lock .t-mid circle{stroke-width:1.2;opacity:.8}
.lock .t-mid .block{stroke-width:6;opacity:.25;transition:opacity .4s}
.lock .t-mid .block.on{opacity:1}
.lock .t-status{stroke-width:3.4;stroke-linecap:round}
.lock .t-cross line{stroke-width:1.4}
.lock .t-cross .mark{stroke:#ff4fd8;stroke-width:2}
/* the segmented ring */
.lock .t-seg,.lock .t-dot{display:none}
.lock.ring .t-seg{display:inline;stroke-width:3;stroke-linecap:butt;color:#5ff0ff}
.lock.ring .t-seg line{transition:stroke .3s}
.lock.ring .t-dot{display:inline;filter:drop-shadow(0 0 8px currentColor)}
.lock.ring .t-seg{filter:drop-shadow(0 0 1px #000) drop-shadow(0 0 1px #000) drop-shadow(0 0 5px rgba(63,226,255,.85))}
.lock.ring .t-outer,.lock.ring .t-thin,.lock.ring .t-dots,.lock.ring .t-mid,.lock.ring .t-status,.lock.ring .t-cross{display:none}
/* the simple target: one fine ring with four gaps, the status arcs, a crosshair */
.lock.simple .t-outer,.lock.simple .t-thin,.lock.simple .t-dots,.lock.simple .t-cross .mark,.lock.simple .t-mid .block{display:none}
.lock.simple .t-mid circle{stroke-width:1.6;opacity:1;stroke-dasharray:62 10.25;transform:scale(1.25)}
.lock.simple .t-status{stroke-width:2.6}
.lock .t-outer,.lock .t-thin,.lock .t-dots,.lock .t-mid,.lock .t-cross{color:#3fe2ff}
/* the next start today, under AL/X */
.next{margin-top:clamp(22px,3.4vh,40px);font:13px/1.9 "Courier New",monospace;letter-spacing:.04em;color:#c4e2ea;width:min(440px,40vw);text-shadow:0 0 3px #000,0 0 10px rgba(0,0,0,.8)}
.next-head{font-size:12px;letter-spacing:.18em;color:#8fb8c8;margin-bottom:6px}.next-head b{font-weight:400;color:#e9fbff}
.next-grid{display:grid;grid-template-columns:auto 1fr auto;column-gap:16px}
.next-row{display:contents}.next-row>*{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.next-room{color:#e9fbff}.next-title{color:#7fa8b8}.next-count{display:flex;align-items:center;gap:8px;justify-content:flex-end;color:#e9fbff}
.next i{flex:none;display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 7px var(--green)}
.next-row.warn .next-count{color:#ffd48a}.next-row.bad .next-count{color:#ff8fa3}
.next-row.warn i,.next-reader.warn i{background:var(--amber);box-shadow:0 0 7px var(--amber)}.next-row.bad i,.next-reader.bad i{background:var(--red);box-shadow:0 0 7px var(--red)}
.next-reader{grid-column:1/-1;display:flex;align-items:center;gap:10px;padding-left:14px;white-space:nowrap;font-size:12px}
.next-reader.warn{color:#ffd48a}.next-reader.bad{color:#ff8fa3}.next-more{grid-column:1/-1;color:#7fa8b8;font-size:12px}
@media (max-width:740px){.next{display:none}}
.link-warn{position:absolute;top:clamp(110px,15vh,150px);right:clamp(28px,4.3vw,82px);font:600 12px/1.4 "Courier New",monospace;letter-spacing:.12em;color:#ffc24a;text-shadow:0 0 10px rgba(255,170,0,.5);text-align:right}
#matrix:focus-visible{outline:none} .render-note{position:fixed;inset:auto 12vw 35vh;text-align:center;color:#8ebed0;font:13px/2 "Courier New",monospace;letter-spacing:.12em;z-index:3;pointer-events:none} @media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<canvas id="matrix" aria-label="Live 3D luminous particle wave with 60 selectable conference reader lights"></canvas>

<div class="tags" id="tags"></div>
<svg id="lock" class="lock" aria-hidden="true"></svg>
<main class="shell">
  <header class="mast"><div class="brand">AL<span>/</span>X</div><section class="next" id="next" aria-label="Next event" hidden></section></header>
  <div class="link-warn" id="linkWarn" hidden></div>
  <div class="metrics" aria-live="polite"><div class="metric"><div class="metric-num"><span id="onlineCount">00</span><small id="totalCount">/0</small></div><div class="metric-label">ONLINE</div></div><div class="metric danger"><div class="metric-num" id="issueCount">00</div><div class="metric-label">NEED ATTENTION</div></div></div>
  
  <aside class="side visible" id="side" aria-live="off">
    <div class="side-head"><span class="focus-led" id="focusLed"></span><span id="mode">AL/X</span></div>
    <div class="case-body" id="caseBody">
    <div class="side-meta" id="signalId" style="--delay:0ms">SIGNAL 002 &nbsp;·&nbsp; INCIDENT 01 / 05</div>
    <h1 class="side-name" id="name" style="--delay:70ms">—</h1>
    <div class="side-issue critical" id="issue" style="--delay:130ms"></div>
    <div class="side-context" style="--delay:190ms"><div><span>EXPECTED</span> &nbsp;<strong id="session" style="font-weight:400">—</strong></div><div><span>SINCE</span> &nbsp;&nbsp;&nbsp;&nbsp;<strong id="lastSeen" style="font-weight:400">—</strong></div><div><span>VITALS</span> &nbsp;&nbsp;&nbsp;<strong id="vitals" style="font-weight:400">—</strong></div></div>
    <div class="progress-rule" id="progressRule" style="--delay:270ms"></div>
    <div class="action-header" id="actionHeader" style="--delay:330ms">AL/X / INVESTIGATING</div>
    <div class="log" id="logs" style="--delay:390ms"></div>
    <div class="action-text" style="--delay:500ms"><time id="actionTime"></time><span class="action-words"><span id="action" aria-hidden="true"></span><span class="sr-only" id="actionA11y" role="status" aria-live="polite"></span><i class="cursor" aria-hidden="true"></i></span></div>
    <div class="manual" id="manualHint" hidden></div>
    </div>
  </aside>
  <div class="field-id"><span class="live"></span><b>BHL</b> &nbsp;·&nbsp; <span id="fleetLine"></span></div>
  
</main>
<script>
/*
 AL/X · BHL signal field (D-041, amended 2026-10-12): the readers in use
 today as lights on a living particle field, the ones with a problem burning
 red or amber and labelled. AL/X takes them in turn: a HUD ring locks on,
 a trace runs from her readout, and the readout shows the problem, its log
 and what happens next. Live data from /reader-tile.json, every 5 seconds.
 Opened from the BHL item when ALX_BHL_DISPLAY=field; Esc closes it.

 window.ALXSignalField: getReaders(), selectReader(uid), resumeAuto(), getDiagnostics()
*/
(() => {
'use strict';
let canvas=document.querySelector('#matrix');
const e=id=>document.getElementById(id);
const reduced=matchMedia('(prefers-reduced-motion: reduce)');
// Live: the fleet and its problems come from AL/X (/reader-tile.json), the
// same data as the drop-down traces (D-041).
const states={'healthy':'NOMINAL','bad':'ERROR','warn':'WARNING'};
const tone=s=>s==='bad'?1:s==='healthy'?0:2;
const readers=[],byUid=new Map(),views=new Map();
let fleetInfo={rooms:0,readers:0,online:0},haveTile=false;
// Friedl, 2026-10-12: a problem AL/X is putting right herself stays in
// focus until it is resolved. Anything else (waiting on a person, the
// signal, the reader) is shown for a while and she moves on, coming back on
// her next round; it stays lit and labelled on the field throughout.
const HOLD_MS=9000,RESOLVED_HOLD_MS=2600;
let resolvedAt=0;
const fract=n=>n-Math.floor(n);
const hash=n=>fract(Math.sin(n*127.17+13.51)*43758.5453);
// Spread the readers over the field: a loose grid, each place nudged.
function layoutReader(r,i,n){const cols=Math.max(1,Math.ceil(Math.sqrt(n*1.8))),rows=Math.max(1,Math.ceil(n/cols));
 const col=i%cols,row=Math.floor(i/cols);
 r.u=.07+(col+.5+(hash(i*3.1)-.5)*.5)/cols*.86;r.v=.12+(rows>1?row/(rows-1):.5)*.72+(hash(i*7.3)-.5)*.05;
 r.wx=-7.6+r.u*15.2;r.wz=-6.7+r.v*13.4;}
const hhmm=iso=>{const d=new Date(iso);return isNaN(d)?'':d.toTimeString().slice(0,5);};
function viewOf(t){
 const who={alx:'AL/X',tech:'NEEDS A PERSON',reader:'THE READER'}[t.issue?.who]||'AL/X';
 return {issue:t.issue?.text||'',session:t.event?`${t.event.title} · ${t.event.when}`:'—',
  last:t.since?`since ${hhmm(t.since)}`:'—',
  vitals:[t.power?`${t.power.source==='usb'?'usb':'battery'}${Number.isFinite(t.power.percent)?' '+t.power.percent+'%':''}`:'',Number.isFinite(t.signal)?`signal ${t.signal}%`:''].filter(Boolean).join(' · ')||'—',log:(t.trace||[]).map(([a,b])=>[a,b]),
  stages:[[t.alerted?'FRIEDL ALERTED':who,t.issue?.action||t.issue?.text||'']],alerted:Boolean(t.alerted),fixable:Boolean(t.fixable)};
}
const example=r=>views.get(r.id);
// The first eight faults shape the field: the shader takes eight, and the
// labels, rings and clicks must sit on the same surface. Set per update.
let shapeFaults=[];
const faults=()=>readers.filter(x=>x.state!=='healthy').sort((a,b)=>tone(a.state)===tone(b.state)?a.index-b.index:tone(a.state)===1?-1:1);
let focus=null,stage=0,auto=true,manualUntil=0,focusStarted=0,hover=null;
let veinPhase='idle',veinSince=0,queuedFocus=null,contactSince=-1;
let actionTyping=null; // extends → energizes → holds → disperses → retracts
let width=1,height=1,dpr=1,aspect=1,time=0,last=0,frame=0,fps=0,paused=false,dirty=true;
let gl,resources,programs,vaos,buffer,redrawNodes=true,bloomAvailable=false;
let mode='webgl2',errorMessage='';
const VEIN_EXTEND_MS=2050, VEIN_WRAP_MS=900, VEIN_UNWRAP_MS=640, VEIN_RETRACT_MS=1270, STAGE_MS=4100;
const triageHoldMs=d=>d?Math.max(10400,d.stages.length*STAGE_MS+1100):10400;
function veinProgress(now){if(reduced.matches)return veinPhase==='holding'?1:0;
 const dt=Math.max(0,now-veinSince);
 if(veinPhase==='holding'||veinPhase==='wrapping'||veinPhase==='unwrapping')return 1;
 if(veinPhase==='extending'){const u=Math.min(1,dt/VEIN_EXTEND_MS);return u*u*(3-2*u);}
 if(veinPhase==='retracting'){const u=Math.min(1,dt/VEIN_RETRACT_MS);return 1-u*u*(3-2*u);}
 return 0;
}
function curlProgress(now){
 if(reduced.matches)return veinPhase==='holding'?1:0;
 const ease=u=>u*u*(3-2*u);
 if(veinPhase==='holding')return 1;
 if(veinPhase==='wrapping')return ease(Math.min(1,(now-veinSince)/VEIN_WRAP_MS));
 if(veinPhase==='unwrapping')return 1-ease(Math.min(1,(now-veinSince)/VEIN_UNWRAP_MS));
 return 0;
