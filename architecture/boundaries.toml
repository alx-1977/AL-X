# D-025. A second fetcher would be a second way onto the network.
entry = "providers/web_fetch.py::HttpWebFetchProvider.fetch"
forbidden = []

[[outcomes]]
id = "xero.supplier_bill_is_committed"
description = "An ordinary supplier bill is committed to Xero."
# D-020. Five capabilities could each independently reach a posted bill before
# `capture_supplier_invoice` consolidated them; all five were deleted.
entry = "tools/xero.py::build_xero_executors.<locals>.capture_invoice"
forbidden = [
  "execute_xero_bill",
  "create_xero_draft_bill",
  "update_xero_draft_bill",
  "attach_mail_document_to_xero_bill",
  "authorise_xero_bill",
]

[[outcomes]]
id = "xero.contact_is_renamed"
description = "One existing Xero contact is renamed by exact ContactID."
# D-034. The only contact write. Nothing was superseded: before it, Friedl
# renamed contacts in Xero by hand.
entry = "tools/xero.py::build_xero_executors.<locals>.update_contact"
forbidden = []

[[outcomes]]
id = "xero.supplier_contact_is_created"
description = "One new Xero supplier contact is created by exact name."
# D-035. Nothing was superseded: before it, Friedl created supplier contacts
# in Xero by hand.
entry = "tools/xero.py::build_xero_executors.<locals>.create_contact"
forbidden = []

[[outcomes]]
id = "dhl.import_is_posted"
description = "A DHL import is reconciled and posted as its own bill."
# D-021. A separate outcome from an ordinary bill, and deliberately so: a DHL
# document reaching the ordinary path would be the Law 0 violation.
entry = "tools/dhl.py::build_dhl_executors.<locals>.process"
forbidden = ["analyze_dhl_customs_documents", "reconcile_dhl_import_documents"]

[[outcomes]]
id = "project.scope_is_recorded"
description = "A durable project scope is created and given its lifecycle."
# Stage 1 of the continuity architecture. A project is identity and lifecycle
# only; the scope it provides is a label on records that keep their own
# authoritative stores. A second writer here would be a competing route to the
# same coordinate, and a project that accumulated content would be a second
# memory system with none of memory's supersession or isolation guarantees.
entry = "projects/store.py::SQLiteProjectStore.create"
forbidden = []
